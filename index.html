<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Poké-Robô: Evolução</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e; font-family: sans-serif; overflow: hidden;
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
  }
  
  /* Telas de Início e Loading */
  #loading { position: fixed; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
  .spin { border: 8px solid #333; border-top: 8px solid #ffd700; border-radius: 50%; width: 60px; height: 60px; animation: s 1s linear infinite; margin-bottom: 20px; }
  @keyframes s { to { transform: rotate(360deg); } }
  
  #menu { display: none; text-align: center; background: rgba(0,0,0,0.85); padding: 30px; border-radius: 20px; border: 4px solid #ffd700; z-index: 20; }
  .chars { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .btn { background: #333; border: 3px solid #555; border-radius: 10px; padding: 10px; cursor: pointer; color: white; font-weight: bold; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
  .btn:hover { transform: scale(1.1); border-color: #ffd700; }
  .btn img { width: 64px; height: 64px; image-rendering: pixelated; margin-bottom: 5px; }

  /* Área do Jogo */
  #game { display: none; flex-direction: column; align-items: center; width: 100%; }
  
  /* HUD (Topo) */
  #hud { display: flex; gap: 10px; margin-bottom: 10px; font-weight: bold; text-shadow: 2px 2px 0 #000; flex-wrap: wrap; justify-content: center; font-size: 20px; }
  .box { background: rgba(0,0,0,0.8); padding: 6px 14px; border-radius: 8px; border: 2px solid #0f3460; display: flex; align-items: center; gap: 5px; }
  
  /* Contador de Bola Dourada */
  .gold-box { background: rgba(50, 40, 0, 0.9); border: 2px solid #ffd700; border-radius: 8px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; }
  .gold-box img { width: 28px; height: 28px; image-rendering: pixelated; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }

  /* Barra de Poder */
  .pbg { width: 100px; height: 20px; background: #333; border: 2px solid #000; border-radius: 10px; overflow: hidden; position: relative; }
  .pfill { height: 100%; width: 0%; transition: 0.1s; }
  .ptext { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 12px; color: white; text-shadow: 1px 1px 1px #000; }

  /* Tela do Jogo */
  #container { 
    position: relative; border: 8px solid #0f3460; border-radius: 16px; background: #7ec850; overflow: hidden; 
    width: 95vw; max-width: 1200px; /* TELA BEM MAIOR */
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  
  #dmg { position: absolute; inset: 0; background: rgba(255,0,0,0.4); display: none; z-index: 5; pointer-events: none; }
  #end { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.95); padding: 30px 50px; border-radius: 15px; text-align: center; border: 4px solid #ffd700; display: none; z-index: 10; white-space: nowrap; font-size: 24px; }
  #end button { margin-top: 20px; padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; background: #ffd700; color: #000; }
  .inst { margin-top: 10px; font-size: 16px; color: #ccc; }
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><h2>Carregando...</h2></div>

<div id="menu">
  <h1>Quem vai evoluir hoje?</h1>
  <div class="chars">
    <div class="btn" onclick="start('pikachu')"><img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/25.png">Pikachu</div>
    <div class="btn" onclick="start('charmander')"><img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/4.png">Charmander</div>
    <div class="btn" onclick="start('bulbasaur')"><img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/1.png">Bulbasaur</div>
    <div class="btn" onclick="start('squirtle')"><img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/7.png">Squirtle</div>
  </div>
</div>

<div id="game">
  <div id="hud">
    <div class="box" style="color:#00ffcc">Fase: <span id="lvl">1</span></div>
    <div class="box" style="color:#ff5555">Pokébolas: <span id="sc">0</span>/<span id="tot">0</span></div>
    <div class="box" style="color:#ff5555">Vidas: <span id="lives">❤️❤️❤️</span></div>
    
    <!-- CONTADOR VISUAL DE BOLA DOURADA -->
    <div class="gold-box">
      <img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/master-ball.png">
      <span style="color:#ffd700;">Evolução: <span id="gold-ui">0</span>/5</span>
    </div>

    <div class="box" style="color:#ffd700">Poder: 
      <div class="pbg"><div class="pfill" id="pfill"></div><div class="ptext" id="ptext">0%</div></div>
    </div>
  </div>
  
  <div id="container">
    <canvas id="cv"></canvas>
    <div id="dmg"></div>
    <div id="end"><span id="endTxt"></span><br><button onclick="reset()">Continuar</button></div>
  </div>
  <div class="inst">Setas para andar | ESPAÇO para atacar | Pegue 5 Bolas Douradas para EVOLUIR!</div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const T = 50, MW = 17, MH = 13;
cv.width = MW * T; cv.height = MH * T;

const img = {
  pikachu: new Image(), raichu: new Image(), charmander: new Image(), charmeleon: new Image(),
  bulbasaur: new Image(), ivysaur: new Image(), squirtle: new Image(), wartortle: new Image(),
  zubat: new Image(), koffing: new Image(), jessie: new Image(), james: new Image(),
  ball: new Image(), gold: new Image()
};
img.pikachu.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/25.png";
img.raichu.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/26.png";
img.charmander.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/4.png";
img.charmeleon.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/5.png";
img.bulbasaur.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/1.png";
img.ivysaur.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/2.png";
img.squirtle.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/7.png";
img.wartortle.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/8.png";
img.zubat.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/41.png";
img.koffing.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/109.png";
img.jessie.src="https://play.pokemonshowdown.com/sprites/trainers/jessie.png";
img.james.src="https://play.pokemonshowdown.com/sprites/trainers/james.png";
img.ball.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/poke-ball.png";
img.gold.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/master-ball.png";

let loaded = 0;
for (let k in img) { 
  img[k].onload = () => { loaded++; if(loaded >= 14 && !started) { document.getElementById('loading').style.display='none'; document.getElementById('menu').style.display='block'; } }; 
}

let started = false, char = 'pikachu', isEvolved = false, goldCount = 0;
let lvl = 1, lives = 3, score = 0, tot = 0;
let map = [], items = [], goldBalls = [], enemies = [], rockets = [], particles = [];
let p = { x: 0, y: 0, r: 18, spd: 3.5, timer: 0, inv: false };
let target = { x: 0, y: 0, r: 20, active: false };
let keys = {}, power = 0, wave = 0, cool = 0, goldTimer = 300, win = false, popupTexts = [];

window.onkeydown = e => { keys[e.code] = true; if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); };
window.onkeyup = e => { keys[e.code] = false; };

function start(c) {
  started = true; char = c;
  document.getElementById('lvl').innerText = lvl;
  document.getElementById('menu').style.display = 'none'; document.getElementById('game').style.display = 'flex';
  initLevel();
  if(!window.reqId) loop();
}

function reset() { 
  if(lives <= 0) { lvl = 1; isEvolved = false; goldCount = 0; document.getElementById('lvl').innerText = lvl; document.getElementById('gold-ui').innerText = goldCount; } 
  initLevel(); 
}
function nextLvl() { lvl++; document.getElementById('lvl').innerText = lvl; initLevel(); }

function initLevel() {
  lives = 3; power = 0; wave = 0; cool = 0; particles = []; popupTexts = [];
  goldBalls = []; goldTimer = 200; // Aparece mais rápido no início da fase
  updateLives(); updatePower();
  
  // Gera Labirinto
  map = Array.from({length: MH}, () => Array(MW).fill(1));
  let stack = [{x:1, y:1}]; map[1][1] = 0;
  let dirs = [{x:0,y:-2},{x:0,y:2},{x:-2,y:0},{x:2,y:0}];
  while(stack.length) {
    let cur = stack[stack.length-1], nb = [];
    for(let d of dirs) {
      let nx = cur.x+d.x, ny = cur.y+d.y;
      if(nx>0 && nx<MW-1 && ny>0 && ny<MH-1 && map[ny][nx]===1) nb.push({x:nx, y:ny, px:cur.x+d.x/2, py:cur.y+d.y/2});
    }
    if(nb.length) { let n = nb[Math.floor(Math.random()*nb.length)]; map[n.py][n.px]=0; map[n.y][n.x]=0; stack.push({x:n.x, y:n.y}); } else stack.pop();
  }
  // Quebra becos
  for(let r=1; r<MH-1; r++) for(let c=1; c<MW-1; c++) {
    if(map[r][c]===0) {
      let w=0, v=[];
      if(map[r-1][c]===1){w++;v.push({dr:-1,dc:0})} if(map[r+1][c]===1){w++;v.push({dr:1,dc:0})}
      if(map[r][c-1]===1){w++;v.push({dr:0,dc:-1})} if(map[r][c+1]===1){w++;v.push({dr:0,dc:1})}
      if(w>=3) { let b = v.filter(d=>r+d.dr>0 && r+d.dr<MH-1 && c+d.dc>0 && c+d.dc<MW-1); if(b.length) { let d=b[Math.floor(Math.random()*b.length)]; map[r+d.dr][c+d.dc]=0; } }
    }
  }

  p.x = 1*T+T/2; p.y = 1*T+T/2; p.inv = false;
  target.x = (MW-2)*T+T/2; target.y = (MH-2)*T+T/2; target.active = false;
  let cells = [];
  for(let r=1; r<MH-1; r++) for(let c=1; c<MW-1; c++) if(map[r][c]===0 && !(r===1&&c===1) && !(r===MH-2&&c===MW-2)) cells.push({c,r});
  cells.sort(() => Math.random()-0.5);
  
  items = []; tot = Math.min(3+(lvl-1), Math.floor(cells.length/2));
  for(let i=0; i<tot; i++) items.push({x:cells[i].c*T+T/2, y:cells[i].r*T+T/2, r:18, got:false});
  
  enemies = []; rockets = [];
  let ne = Math.min(1+Math.floor(lvl/2), 3);
  for(let i=0; i<ne; i++) {
    let c = cells[cells.length-1-i]; if(!c) continue;
    let d = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].sort(()=>Math.random()-0.5)[0];
    enemies.push({x:c.c*T+T/2, y:c.r*T+T/2, r:18, gc:c.c, gr:c.r, type:i%2===0?'zubat':'koffing', tm:Math.random()*10, dx:d.dx, dy:d.dy, spd:2.0+lvl*0.2});
  }
  let nr = Math.min(Math.floor(lvl/2), 2);
  for(let i=0; i<nr; i++) {
    let c = cells.filter(x=>x.r>2&&x.c>2)[i]; if(!c) continue;
    let d = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].sort(()=>Math.random()-0.5)[0];
    rockets.push({x:c.c*T+T/2, y:c.r*T+T/2, r:18, gc:c.c, gr:c.r, type:i%2===0?'jessie':'james', tm:Math.random()*10, dx:d.dx, dy:d.dy, spd:1.8});
  }
  
  score = 0; win = false;
  document.getElementById('sc').innerText = score; document.getElementById('tot').innerText = tot;
  document.getElementById('gold-ui').innerText = goldCount;
  document.getElementById('end').style.display = 'none';
  document.getElementById('dmg').style.display = 'none';
}

function updateLives() { document.getElementById('lives').innerText = "❤️".repeat(lives) + "🖤".repeat(3-lives); }
function updatePower() { document.getElementById('pfill').style.width = power+'%'; document.getElementById('ptext').innerText = Math.floor(power)+'%'; }

function wall(cx, cy, r) {
  let c1=Math.floor((cx-r)/T), c2=Math.floor((cx+r)/T), r1=Math.floor((cy-r)/T), r2=Math.floor((cy+r)/T);
  for(let row=r1; row<=r2; row++) for(let col=c1; col<=c2; col++) {
    if(row<0||row>=MH||col<0||col>=MW||map[row][col]===1) {
      let nx = Math.max(col*T, Math.min(cx, col*T+T)), ny = Math.max(row*T, Math.min(cy, row*T+T));
      if((cx-nx)**2 + (cy-ny)**2 < r**2) return true;
    }
  }
  return false;
}
function free(c, r) { return c>=0 && c<MW && r>=0 && r<MH && map[r][c]===0; }
function sight(c1, r1, c2, r2) {
  if(c1!==c2 && r1!==r2) return false;
  if(c1===c2) { for(let r=Math.min(r1,r2)+1; r<Math.max(r1,r2); r++) if(map[r][c1]===1) return false; }
  else { for(let c=Math.min(c1,c2)+1; c<Math.max(c1,c2); c++) if(map[r1][c]===1) return false; }
  return true;
}
function hit() {
  p.inv = true; lives--; updateLives(); document.getElementById('dmg').style.display='block';
  setTimeout(()=>document.getElementById('dmg').style.display='none', 200);
  p.x = 1*T+T/2; p.y = 1*T+T/2;
  if(lives<=0) { win=true; document.getElementById('endTxt').innerText="💀 Capturado!"; document.getElementById('end').style.display='block'; }
  else setTimeout(()=>p.inv=false, 1500);
}
function moveAI(e, spd, chase) {
  let cx = e.gc*T+T/2, cy = e.gr*T+T/2, dx = cx-e.x, dy = cy-e.y, d = Math.hypot(dx,dy);
  if(d>0) { e.x += (dx/d)*Math.min(spd,d); e.y += (dy/d)*Math.min(spd,d); }
  if(Math.abs(e.x-cx)<1 && Math.abs(e.y-cy)<1) {
    e.x=cx; e.y=cy; let can = free(e.gc+e.dx, e.gr+e.dy);
    if(chase) {
      let pc=Math.floor(p.x/T), pr=Math.floor(p.y/T), d2=Math.abs(pc-e.gc)+Math.abs(pr-e.gr);
      if(d2<=3 && sight(e.gc,e.gr,pc,pr)) {
        let pos = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].filter(x=>free(e.gc+x.dx, e.gr+x.dy));
        if(pos.length) { let best=pos[0], bd=Infinity; for(let x of pos) { let dst=Math.abs(pc-(e.gc+x.dx))+Math.abs(pr-(e.gr+x.dy)); if(dst<bd){bd=dst;best=x;} } e.dx=best.dx; e.dy=best.dy; can=true; }
      }
    }
    if(!can) { let pos = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].filter(x=>free(e.gc+x.dx, e.gr+x.dy)); if(pos.length){ let x=pos[Math.floor(Math.random()*pos.length)]; e.dx=x.dx; e.dy=x.dy; can=true; } }
    if(can) { e.gc+=e.dx; e.gr+=e.dy; }
  }
}

function update() {
  if(win) return;
  
  // ==========================================
  // 1. MOVIMENTO E CARREGAMENTO DE PODER CORRIGIDO
  // ==========================================
  let dx=0, dy=0;
  if(keys['ArrowUp']) dy--; if(keys['ArrowDown']) dy++; if(keys['ArrowLeft']) dx--; if(keys['ArrowRight']) dx++;
  
  let moveu = false; // Flag que garante que o poder só enche se sair do lugar

  if(dx!==0 || dy!==0) {
    let l=Math.hypot(dx,dy); dx=(dx/l)*p.spd; dy=(dy/l)*p.spd;
    
    // Tenta mover no eixo X
    if(!wall(p.x+dx, p.y, p.r)) { p.x+=dx; moveu = true; }
    // Tenta mover no eixo Y
    if(!wall(p.x, p.y+dy, p.r)) { p.y+=dy; moveu = true; }
    
    if(moveu) {
      p.timer+=0.3;
      if(power<100) { 
        // Enche mais rápido se já evoluiu
        let chargeRate = isEvolved ? 1.5 : 0.8;
        power = Math.min(100, power + chargeRate); 
        updatePower(); 
      }
    }
  } else {
    p.timer+=0.1;
  }

  // 2. USO DO PODER
  if(cool>0) cool--;
  if(keys['Space'] && power>=100 && cool<=0) {
    power=0; cool=60; wave=10; updatePower();
    let c1 = char==='pikachu'?'#ff0':char==='charmander'?'#f40':char==='squirtle'?'#0bf':'#3c3';
    let c2 = char==='pikachu'?'#fff':char==='charmander'?'#fc0':char==='squirtle'?'#eff':'#9f9';
    for(let i=0; i<30; i++) {
      let a=Math.random()*Math.PI*2, s=Math.random()*6+2;
      particles.push({x:p.x, y:p.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col:Math.random()>0.5?c1:c2, sz:Math.random()*6+4});
    }
    let br=T*2.5;
    enemies = enemies.filter(e=>Math.hypot(p.x-e.x, p.y-e.y)>br);
    rockets = rockets.filter(e=>Math.hypot(p.x-e.x, p.y-e.y)>br);
  }
  if(wave>0) { wave+=15; if(wave>T*3) wave=0; }
  
  // Efeito visual das partículas
  for(let i=particles.length-1; i>=0; i--) {
    let pt=particles[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.95; pt.vy*=0.95; pt.life-=0.04;
    if(pt.life<=0) particles.splice(i,1);
  }
  
  // Popups de texto ("+1 Bola", "EVOLUIU!")
  for(let i=popupTexts.length-1; i>=0; i--) {
    let txt = popupTexts[i]; txt.y -= 1; txt.life -= 0.02;
    if(txt.life <= 0) popupTexts.splice(i,1);
  }

  // ==========================================
  // 3. LÓGICA DAS BOLAS DOURADAS (EVOLUÇÃO)
  // ==========================================
  if(!isEvolved && goldCount < 5 && goldBalls.length === 0) {
    goldTimer--;
    if(goldTimer <= 0) {
      let emptyCells = [];
      for(let r=1; r<MH-1; r++) for(let c=1; c<MW-1; c++) {
        if(map[r][c]===0) emptyCells.push({c,r});
      }
      if(emptyCells.length > 0) {
        let cell = emptyCells[Math.floor(Math.random()*emptyCells.length)];
        goldBalls.push({x:cell.c*T+T/2, y:cell.r*T+T/2, r:18});
      }
    }
  }

  for(let i=goldBalls.length-1; i>=0; i--) {
    let b = goldBalls[i];
    if(Math.hypot(p.x-b.x, p.y-b.y) < p.r + b.r) {
      goldBalls.splice(i,1); 
      goldCount++; 
      document.getElementById('gold-ui').innerText = goldCount;
      popupTexts.push({text: "+1 Bola Dourada!", x: p.x, y: p.y - 30, life: 1, color: '#ffd700'});
      goldTimer = 500; // 8 segundos para a próxima
      
      if(goldCount >= 5 && !isEvolved) {
        isEvolved = true; 
        p.spd = 4.8; // Fica mais rápido
        power = 100; 
        updatePower();
        popupTexts.push({text: "EVOLUIU!", x: p.x, y: p.y - 50, life: 2, color: '#ffaa00'});
      }
    }
  }

  // 4. INIMIGOS E COLETA NORMAL
  enemies.forEach(e=>{ e.tm+=0.1; moveAI(e, e.spd, false); });
  rockets.forEach(e=>{ e.tm+=0.1; moveAI(e, e.spd, true); });
  items.forEach(i=>{
    if(!i.got && Math.hypot(p.x-i.x, p.y-i.y)<p.r+i.r) { i.got=true; score++; document.getElementById('sc').innerText=score; if(score===tot) target.active=true; }
  });
  
  if(!p.inv) {
    let h=false; enemies.concat(rockets).forEach(e=>{ if(Math.hypot(p.x-e.x, p.y-e.y)<p.r+e.r-8) h=true; });
    if(h) hit();
  }
  
  if(target.active && Math.hypot(p.x-target.x, p.y-target.y)<p.r+target.r) {
    win=true; document.getElementById('endTxt').innerText="🎉 Fase Concluída!"; document.getElementById('end').style.display='block';
  }
}

function sprite(im, x, y, s, flip=false, isRocket=false) {
  ctx.save(); ctx.translate(x,y); if(flip) ctx.scale(-1,1);
  if(im && im.complete && im.naturalWidth>0) ctx.drawImage(im, -s/2, -s/2, s, s);
  else {
    if(isRocket) { ctx.fillStyle='#d32f2f'; ctx.fillRect(-s/2,-s/2,s,s); ctx.fillStyle='#fff'; ctx.font=`bold ${s*0.7}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('R',0,2); }
    else { ctx.beginPath(); ctx.arc(0,0,s/2,0,Math.PI*2); ctx.fillStyle='#ccc'; ctx.fill(); ctx.stroke(); }
  }
  ctx.restore();
}

function draw() {
  // Mapa
  for(let r=0; r<MH; r++) for(let c=0; c<MW; c++) {
    ctx.fillStyle = map[r][c]===1 ? '#4a2e15' : ((r+c)%2===0?'#8fd45a':'#83c94f');
    ctx.fillRect(c*T, r*T, T, T);
    if(map[r][c]===1) { ctx.fillStyle='#3a200d'; ctx.fillRect(c*T+4, r*T+4, T-8, T-8); }
  }
  
  // Itens
  items.forEach(i=>{ if(!i.got) sprite(img.ball, i.x, i.y, 36); });
  
  // Bolas Douradas
  evoBalls = goldBalls; // alias
  evoBalls.forEach(b=>{ 
    ctx.save(); ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
    sprite(img.gold, b.x, b.y + Math.sin(Date.now()/150)*4, 46*(1+Math.sin(Date.now()/200)*0.1)); 
    ctx.restore(); 
  });
  
  // Inimigos
  enemies.forEach(e=>{ sprite(img[e.type], e.x, e.y+Math.sin(e.tm*4)*3, 42); });
  rockets.forEach(e=>{ sprite(img[e.type], e.x, e.y, 46, e.dx===-1, true); });
  
  // Alvo Final (Pokébola Dourada Mestra)
  if(target.active) { 
    ctx.save(); ctx.shadowColor='#ffcc00'; ctx.shadowBlur=25; 
    sprite(img.gold, target.x, target.y + Math.sin(Date.now()/150)*5, 50*(1+Math.sin(Date.now()/200)*0.15)); 
    ctx.restore(); 
  }
  
  // Efeito de Onda do Poder
  if(wave>0) {
    ctx.save(); let col = char==='pikachu'?'255,255,0':char==='charmander'?'255,69,0':char==='squirtle'?'0,191,255':'50,205,50';
    ctx.beginPath(); ctx.arc(p.x, p.y, wave, 0, Math.PI*2); ctx.strokeStyle=`rgba(${col},${1-wave/(T*3)})`; ctx.lineWidth=8; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, wave*0.8, 0, Math.PI*2); ctx.strokeStyle=`rgba(255,255,255,${1-wave/(T*3)})`; ctx.lineWidth=4; ctx.stroke(); ctx.restore();
  }
  
  // Partículas do Poder
  particles.forEach(pt=>{
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.col;
    if(char==='pikachu') ctx.fillRect(pt.x-pt.sz/2, pt.y-pt.sz/2, pt.sz, pt.sz);
    else if(char==='charmander') { ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.sz, 0, Math.PI*2); ctx.fill(); }
    else if(char==='squirtle') { ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.sz*0.7, 0, Math.PI*2); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(pt.x, pt.y, pt.sz, pt.sz/2, pt.vx, 0, Math.PI*2); ctx.fill(); }
  });
  ctx.globalAlpha=1.0;
  
  // Textos Piscando
  popupTexts.forEach(txt => {
    ctx.save();
    ctx.globalAlpha = txt.life;
    ctx.fillStyle = txt.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText(txt.text, txt.x, txt.y);
    ctx.fillText(txt.text, txt.x, txt.y);
    ctx.restore();
  });
  
  // Jogador
  if(!(p.inv && Math.floor(Date.now()/100)%2===0)) {
    let c = char==='pikachu'?'#f0':char==='charmander'?'#f40':char==='squirtle'?'#0bf':'#3c3';
    if(power>=100 && Math.floor(Date.now()/150)%2===0) { ctx.save(); ctx.shadowColor=c; ctx.shadowBlur=20; }
    
    // Troca o Sprite na Evolução
    let sName = char;
    if(isEvolved) { 
      sName = char==='pikachu'?'raichu':char==='charmander'?'charmeleon':char==='bulbasaur'?'ivysaur':'wartortle'; 
    }
    let size = isEvolved ? 54 : 46; // Fica maior também
    sprite(img[sName], p.x, p.y+Math.sin(p.timer*3)*2, size);
    
    if(power>=100) ctx.restore();
  }
}

function loop() {
  update(); draw();
  window.reqId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
