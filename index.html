<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Poké-Robô: Caçada Infinita</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  /* Tela Inicial */
  #menu {
    text-align: center;
    color: white;
    background: rgba(0,0,0,0.8);
    padding: 40px;
    border-radius: 20px;
    border: 4px solid #ffd700;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
  }
  #menu h1 {
    color: #ffd700;
    margin-top: 0;
    text-shadow: 2px 2px 4px #000;
  }
  .characters {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin: 30px 0;
  }
  .char-btn {
    background: #333;
    border: 4px solid #555;
    border-radius: 15px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
    color: white;
    font-size: 20px;
    font-weight: bold;
  }
  .char-btn:hover {
    transform: scale(1.1);
    border-color: #ffd700;
  }
  .char-btn img {
    width: 100px;
    height: 100px;
    image-rendering: pixelated;
    display: block;
    margin: 0 auto 10px auto;
  }
  
  /* Área do Jogo */
  #game-area {
    display: none; /* Escondido até escolher o personagem */
    flex-direction: column;
    align-items: center;
  }
  
  #hud {
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .hud-item {
    background: rgba(0,0,0,0.5);
    padding: 5px 15px;
    border-radius: 8px;
    border: 2px solid #0f3460;
  }
  
  #game-container {
    position: relative;
    border: 6px solid #0f3460;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    background: #7ec850;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    max-width: 95vw;
    max-height: 65vh;
  }
  
  #win {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95);
    color: #ffd700;
    padding: 30px 50px;
    border-radius: 16px;
    font-size: 28px;
    text-align: center;
    display: none;
    border: 4px solid #ffd700;
    z-index: 10;
    box-shadow: 0 0 20px #ffd700;
    white-space: nowrap;
  }
  #win button {
    margin-top: 20px;
    font-size: 20px;
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    background: #ffd700;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.1s;
  }
  #win button:hover {
    transform: scale(1.1);
  }
  .instrucoes {
    color: #aaa;
    font-size: 16px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<!-- TELA INICIAL -->
<div id="menu">
  <h1>Quem vai explorar hoje?</h1>
  <div class="characters">
    <button class="char-btn" onclick="startGame('pikachu')">
      <img src="https://img.pokemondb.net/sprites/black-white/normal/pikachu.png" alt="Pikachu">
      Pikachu
    </button>
    <button class="char-btn" onclick="startGame('charmander')">
      <img src="https://img.pokemondb.net/sprites/black-white/normal/charmander.png" alt="Charmander">
      Charmander
    </button>
    <button class="char-btn" onclick="startGame('bulbasaur')">
      <img src="https://img.pokemondb.net/sprites/black-white/normal/bulbasaur.png" alt="Bulbasaur">
      Bulbasaur
    </button>
  </div>
</div>

<!-- ÁREA DO JOGO -->
<div id="game-area">
  <div id="hud">
    <div class="hud-item" style="color:#00ffcc">Fase: <span id="level">1</span></div>
    <div class="hud-item" style="color:#ff5555">Pokébolas: <span id="score">0</span> / <span id="total">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="win">
      🎉 Fase Concluída! 🎉
      <br>
      <button onclick="nextLevel()">Ir para a Próxima Fase</button>
    </div>
  </div>

  <div class="instrucoes">Use as setas do teclado para mover e pegar as Pokébolas.</div>
</div>

<script>
// ===== Configuração =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 40;
const MAP_W = 15;
const MAP_H = 11;

canvas.width  = MAP_W * TILE;
canvas.height = MAP_H * TILE;

// ===== Estado Global =====
let currentCharacter = 'pikachu';
let currentLevel = 1;
let MAP = [];
let items = [];
let player = { x: 0, y: 0, r: 12, speed: 2.6, dir: 'down', animTimer: 0 };
let target = { x: 0, y: 0, r: 14, active: false };
let keys = {};
let score = 0;
let totalItems = 0;
let winShown = false;
let gameLoopId = null;

// ===== Iniciar Jogo =====
function startGame(character) {
  currentCharacter = character;
  currentLevel = 1;
  
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game-area').style.display = 'flex';
  
  generateMaze();
  if (!gameLoopId) loop();
}

// ===== Próxima Fase =====
function nextLevel() {
  currentLevel++;
  document.getElementById('level').innerText = currentLevel;
  generateMaze();
}

// ===== Gerador de Labirinto =====
function generateMaze() {
  MAP = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(1));
  
  const stack = [];
  const startX = 1, startY = 1;
  MAP[startY][startX] = 0;
  stack.push({ x: startX, y: startY });

  const dirs = [
    { dx: 0, dy: -2 }, { dx: 0, dy: 2 }, 
    { dx: -2, dy: 0 }, { dx: 2, dy: 0 }
  ];

  while (stack.length > 0) {
    const current = stack[stack.length - 1];
    const neighbors = [];

    for (let d of dirs) {
      const nx = current.x + d.dx;
      const ny = current.y + d.dy;
      if (nx > 0 && nx < MAP_W - 1 && ny > 0 && ny < MAP_H - 1 && MAP[ny][nx] === 1) {
        neighbors.push({ x: nx, y: ny, px: current.x + d.dx / 2, py: current.y + d.dy / 2 });
      }
    }

    if (neighbors.length > 0) {
      const next = neighbors[Math.floor(Math.random() * neighbors.length)];
      MAP[next.py][next.px] = 0;
      MAP[next.y][next.x] = 0;
      stack.push({ x: next.x, y: next.y });
    } else {
      stack.pop();
    }
  }

  player.x = 1 * TILE + TILE / 2;
  player.y = 1 * TILE + TILE / 2;
  player.dir = 'down';
  
  target.x = (MAP_W - 2) * TILE + TILE / 2;
  target.y = (MAP_H - 2) * TILE + TILE / 2;
  target.active = false;

  // Dificuldade aumenta com a fase (mais pokébolas)
  const emptyCells = [];
  for (let r = 1; r < MAP_H - 1; r++) {
    for (let c = 1; c < MAP_W - 1; c++) {
      if (MAP[r][c] === 0 && !(r === 1 && c === 1) && !(r === MAP_H - 2 && c === MAP_W - 2)) {
        emptyCells.push({ c, r });
      }
    }
  }

  emptyCells.sort(() => Math.random() - 0.5);
  items = [];
  // Fase 1 = 3 pokébolas, Fase 2 = 4, Fase 3 = 5...
  const numItems = Math.min(3 + (currentLevel - 1), emptyCells.length);
  
  for (let i = 0; i < numItems; i++) {
    items.push({
      x: emptyCells[i].c * TILE + TILE / 2,
      y: emptyCells[i].r * TILE + TILE / 2,
      r: 12,
      collected: false
    });
  }
  
  totalItems = numItems;
  score = 0;
  winShown = false;
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = totalItems;
  document.getElementById('win').style.display = 'none';
}

// ===== Teclado =====
window.addEventListener('keydown', e => {
  const k = e.code || e.key;
  keys[k] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.code || e.key;
  keys[k] = false;
});

// ===== Colisão =====
function collidesWithWall(cx, cy, r) {
  const minCol = Math.floor((cx - r) / TILE);
  const maxCol = Math.floor((cx + r) / TILE);
  const minRow = Math.floor((cy - r) / TILE);
  const maxRow = Math.floor((cy + r) / TILE);

  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      if (row < 0 || row >= MAP_H || col < 0 || col >= MAP_W) return true;
      if (MAP[row][col] === 1) {
        const rx = col * TILE, ry = row * TILE;
        const nx = Math.max(rx, Math.min(cx, rx + TILE));
        const ny = Math.max(ry, Math.min(cy, ry + TILE));
        const dx = cx - nx, dy = cy - ny;
        if (dx * dx + dy * dy < r * r) return true;
      }
    }
  }
  return false;
}

// ===== Update =====
function update() {
  if (winShown) return;

  let dx = 0, dy = 0;
  if (keys['ArrowUp'])    dy -= 1;
  if (keys['ArrowDown'])  dy += 1;
  if (keys['ArrowLeft'])  dx -= 1;
  if (keys['ArrowRight']) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx = (dx / len) * player.speed;
    dy = (dy / len) * player.speed;
    
    if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
    else player.dir = dy > 0 ? 'down' : 'up';

    if (!collidesWithWall(player.x + dx, player.y, player.r)) player.x += dx;
    if (!collidesWithWall(player.x, player.y + dy, player.r)) player.y += dy;
    
    player.animTimer += 0.3;
  } else {
    player.animTimer += 0.1;
  }

  // Coleta
  items.forEach(item => {
    if (!item.collected) {
      if (Math.hypot(player.x - item.x, player.y - item.y) < player.r + item.r) {
        item.collected = true;
        score++;
        document.getElementById('score').innerText = score;
        if (score === totalItems) target.active = true;
      }
    }
  });

  // Vitória
  if (target.active) {
    if (Math.hypot(player.x - target.x, player.y - target.y) < player.r + target.r) {
      winShown = true;
      document.getElementById('win').style.display = 'block';
    }
  }
}

// ===== Desenho =====
function drawMap() {
  for (let row = 0; row < MAP_H; row++) {
    for (let col = 0; col < MAP_W; col++) {
      if (MAP[row][col] === 1) {
        ctx.fillStyle = '#2d5a1e';
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
        ctx.strokeStyle = '#1f4014';
        ctx.strokeRect(col * TILE, row * TILE, TILE, TILE);
      } else {
        ctx.fillStyle = (row + col) % 2 === 0 ? '#8fd45a' : '#83c94f';
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
      }
    }
  }
}

function drawPokeball(x, y, r, isGold) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, Math.PI, 0);
  ctx.fillStyle = isGold ? '#ffcc00' : '#ff1c1c';
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI);
  ctx.fillStyle = isGold ? '#fff2aa' : '#ffffff';
  ctx.fill();
  
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(x - r, y);
  ctx.lineTo(x + r, y);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.arc(x, y, r * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawTarget() {
  if (!target.active) return;
  const time = Date.now() / 200;
  const scale = 1 + Math.sin(time) * 0.1;
  ctx.save();
  ctx.translate(target.x, target.y);
  ctx.scale(scale, scale);
  drawPokeball(0, 0, target.r, true);
  ctx.restore();
}

// ===== Desenho dos Personagens =====
function drawPlayer() {
  ctx.save();
  const floatOffset = Math.sin(player.animTimer * 3) * 2;
  const py = player.y + floatOffset;
  
  // Define as cores baseadas no personagem escolhido
  let bodyColor, outlineColor, cheekColor;
  if (currentCharacter === 'pikachu') {
    bodyColor = '#ffe033'; outlineColor = '#c9a800'; cheekColor = '#ff5555';
  } else if (currentCharacter === 'charmander') {
    bodyColor = '#ff7f27'; outlineColor = '#cc5500'; cheekColor = '#ff5555';
  } else {
    bodyColor = '#7ec8e3'; outlineColor = '#4a90e2'; cheekColor = '#ff5555';
  }

  // Corpo
  ctx.beginPath();
  ctx.arc(player.x, py, player.r, 0, Math.PI * 2);
  ctx.fillStyle = bodyColor;
  ctx.fill();
  ctx.strokeStyle = outlineColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Detalhes específicos de cada personagem
  if (currentCharacter === 'pikachu') {
    // Orelhas pontudas
    ctx.beginPath();
    ctx.moveTo(player.x - 6, py - player.r + 2);
    ctx.lineTo(player.x - 10, py - player.r - 8);
    ctx.lineTo(player.x - 2, py - player.r + 2);
    ctx.closePath();
    ctx.fillStyle = bodyColor;
    ctx.fill();
    ctx.strokeStyle = outlineColor;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(player.x + 6, py - player.r + 2);
    ctx.lineTo(player.x + 10, py - player.r - 8);
    ctx.lineTo(player.x + 2, py - player.r + 2);
    ctx.closePath();
    ctx.fillStyle = bodyColor;
    ctx.fill();
    ctx.strokeStyle = outlineColor;
    ctx.stroke();
  } else if (currentCharacter === 'charmander') {
    // Chama na cauda
    ctx.beginPath();
    ctx.moveTo(player.x + player.r, py);
    ctx.lineTo(player.x + player.r + 8, py - 5);
    ctx.lineTo(player.x + player.r + 4, py + 5);
    ctx.fillStyle = '#ffcc00';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(player.x + player.r + 2, py);
    ctx.lineTo(player.x + player.r + 6, py - 3);
    ctx.lineTo(player.x + player.r + 4, py + 3);
    ctx.fillStyle = '#ff0000';
    ctx.fill();
  } else if (currentCharacter === 'bulbasaur') {
    // Bulbo nas costas
    ctx.beginPath();
    ctx.arc(player.x, py - player.r + 2, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#4caf50';
    ctx.fill();
    ctx.strokeStyle = '#2e7d32';
    ctx.stroke();
  }

  // Olhos
  const eyeY = py - 3;
  let eyeLX = player.x - 4, eyeRX = player.x + 4;
  if (player.dir === 'left')  { eyeLX = player.x - 7; eyeRX = player.x - 1; }
  if (player.dir === 'right') { eyeLX = player.x + 1; eyeRX = player.x + 7; }
  if (player.dir === 'up')    { eyeLX = player.x - 4; eyeRX = player.x + 4; }

  ctx.beginPath();
  ctx.arc(eyeLX, eyeY, 2, 0, Math.PI * 2);
  ctx.arc(eyeRX, eyeY, 2, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();

  // Bochechas
  if (currentCharacter === 'pikachu') {
    ctx.beginPath();
    ctx.arc(player.x - 7, py + 3, 2.5, 0, Math.PI * 2);
    ctx.arc(player.x + 7, py + 3, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = cheekColor;
    ctx.fill();
  }

  ctx.restore();
}

function loop() {
  update();
  drawMap();
  items.forEach(item => { if (!item.collected) drawPokeball(item.x, item.y, item.r, false); });
  drawTarget();
  drawPlayer();
  gameLoopId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
