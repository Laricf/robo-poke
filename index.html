<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Poké-Robô: Caçada Infinita</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #1a1a2e;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a2e; display: flex; flex-direction: column;
    justify-content: center; align-items: center; z-index: 100; color: white;
  }
  .spinner {
    border: 8px solid #333; border-top: 8px solid #ffd700;
    border-radius: 50%; width: 60px; height: 60px;
    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  #menu {
    text-align: center; color: white; background: rgba(0,0,0,0.85);
    padding: 30px 20px; border-radius: 20px; border: 4px solid #ffd700;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); z-index: 20; max-width: 95vw;
    display: none; 
  }
  #menu h1 { color: #ffd700; margin-top: 0; text-shadow: 2px 2px 4px #000; font-size: 24px; }
  .characters { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
  .char-btn {
    background: #333; border: 3px solid #555; border-radius: 12px; padding: 10px;
    cursor: pointer; transition: all 0.2s; color: white; font-size: 14px; font-weight: bold;
    display: flex; flex-direction: column; align-items: center; width: 100px;
  }
  .char-btn:hover { transform: scale(1.1); border-color: #ffd700; }
  .char-btn img { width: 60px; height: 60px; image-rendering: pixelated; margin-bottom: 5px; }
  
  #game-area { display: none; flex-direction: column; align-items: center; position: relative; }
  
  #hud {
    color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 10px;
    text-shadow: 2px 2px 0 #000;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .hud-item { background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 8px; border: 2px solid #0f3460; }
  
  #game-container {
    position: relative; border: 6px solid #0f3460; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #7ec850; overflow: hidden;
  }
  #game { display: block; image-rendering: pixelated; max-width: 95vw; max-height: 75vh; }
  
  #damage-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0.5); display: none; pointer-events: none; z-index: 5;
  }
  #win, #gameover {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.95); color: #ffd700; padding: 25px 40px;
    border-radius: 16px; font-size: 24px; text-align: center; display: none;
    border: 4px solid #ffd700; z-index: 10; box-shadow: 0 0 20px #ffd700; white-space: nowrap;
  }
  #gameover { color: #ff5555; border-color: #ff5555; box-shadow: 0 0 20px #ff5555; }
  #win button, #gameover button {
    margin-top: 15px; font-size: 18px; padding: 10px 20px; border-radius: 8px;
    border: none; background: #ffd700; cursor: pointer; font-weight: bold;
  }
  #gameover button { background: #ff5555; color: white; }
  .instrucoes { color: #aaa; font-size: 16px; margin-top: 10px; text-align: center; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <h2>Carregando Pokémons...</h2>
</div>

<div id="menu">
  <h1>Quem vai explorar hoje?</h1>
  <div class="characters">
    <button class="char-btn" onclick="startGame('pikachu')">
      <img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/25.png" alt="Pikachu"> Pikachu
    </button>
    <button class="char-btn" onclick="startGame('charmander')">
      <img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/4.png" alt="Charmander"> Charmander
    </button>
    <button class="char-btn" onclick="startGame('bulbasaur')">
      <img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/1.png" alt="Bulbasaur"> Bulbasaur
    </button>
    <button class="char-btn" onclick="startGame('squirtle')">
      <img src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/7.png" alt="Squirtle"> Squirtle
    </button>
  </div>
</div>

<div id="game-area">
  <div id="hud">
    <div class="hud-item" style="color:#00ffcc">Fase: <span id="level">1</span></div>
    <div class="hud-item" style="color:#ff5555">Pokébolas: <span id="score">0</span> / <span id="total">0</span></div>
    <div class="hud-item" style="color:#ff5555">Vidas: <span id="lives">❤️❤️❤️</span></div>
  </div>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="damage-overlay"></div>
    <div id="win">🎉 Fase Concluída! 🎉<br><button onclick="nextLevel()">Próxima Fase</button></div>
    <div id="gameover">💀 Capturado! 💀<br><button onclick="restartLevel()">Tentar de Novo</button></div>
  </div>
  <div class="instrucoes">Use as setas. Cuidado com os vilões!</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TILE = 50;
const MAP_W = 15;
const MAP_H = 11;
canvas.width  = MAP_W * TILE;
canvas.height = MAP_H * TILE;

const sprites = {
  pikachu: new Image(), charmander: new Image(), bulbasaur: new Image(), squirtle: new Image(),
  zubat: new Image(), koffing: new Image(), jessie: new Image(), james: new Image(),
  pokeball: new Image(), goldball: new Image()
};

sprites.pikachu.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/25.png";
sprites.charmander.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/4.png";
sprites.bulbasaur.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/1.png";
sprites.squirtle.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/7.png";
sprites.zubat.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/41.png";
sprites.koffing.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/109.png";
sprites.jessie.src = "https://play.pokemonshowdown.com/sprites/trainers/jessie.png";
sprites.james.src = "https://play.pokemonshowdown.com/sprites/trainers/james.png";
sprites.pokeball.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/poke-ball.png";
sprites.goldball.src = "https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/items/master-ball.png";

let loadedImages = 0;
let gameStarted = false;
const totalImages = Object.keys(sprites).length;

for (let key in sprites) {
  sprites[key].onload = checkLoad;
  sprites[key].onerror = checkLoad;
}

function checkLoad() {
  loadedImages++;
  if (loadedImages >= totalImages && !gameStarted) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('menu').style.display = 'block';
  }
}

let currentCharacter = 'pikachu';
let currentLevel = 1;
let MAP = [], items = [], enemies = [], rockets = [];
let player = { x: 0, y: 0, r: 18, speed: 3.5, dir: 'down', animTimer: 0, invulnerable: false };
let target = { x: 0, y: 0, r: 20, active: false };
let keys = {};
let score = 0, totalItems = 0, lives = 3;
let winShown = false, gameLoopId = null;

function startGame(character) {
  gameStarted = true; 
  currentCharacter = character;
  currentLevel = 1;
  document.getElementById('level').innerText = currentLevel;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game-area').style.display = 'flex';
  startLevel();
  if (!gameLoopId) loop();
}

function nextLevel() {
  currentLevel++;
  document.getElementById('level').innerText = currentLevel;
  startLevel();
}

function restartLevel() { startLevel(); }

function startLevel() {
  lives = 3;
  updateLivesUI();
  generateMaze();
}

function updateLivesUI() {
  let heartStr = "";
  for (let i = 0; i < lives; i++) heartStr += "❤️";
  for (let i = lives; i < 3; i++) heartStr += "🖤";
  document.getElementById('lives').innerText = heartStr;
}

function generateMaze() {
  // 1. Cria o labirinto perfeito
  MAP = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(1));
  const stack = [{ x: 1, y: 1 }];
  MAP[1][1] = 0;
  const dirs = [{ dx: 0, dy: -2 }, { dx: 0, dy: 2 }, { dx: -2, dy: 0 }, { dx: 2, dy: 0 }];

  while (stack.length > 0) {
    const current = stack[stack.length - 1];
    const neighbors = [];
    for (let d of dirs) {
      const nx = current.x + d.dx;
      const ny = current.y + d.dy;
      if (nx > 0 && nx < MAP_W - 1 && ny > 0 && ny < MAP_H - 1 && MAP[ny][nx] === 1) {
        neighbors.push({ x: nx, y: ny, px: current.x + d.dx / 2, py: current.y + d.dy / 2 });
      }
    }
    if (neighbors.length > 0) {
      const next = neighbors[Math.floor(Math.random() * neighbors.length)];
      MAP[next.py][next.px] = 0;
      MAP[next.y][next.x] = 0;
      stack.push({ x: next.x, y: next.y });
    } else {
      stack.pop();
    }
  }

  // ===== 2. ALGORITMO BRAIDED (Quebra de Paredes para criar Rotas de Fuga) =====
  for (let r = 1; r < MAP_H - 1; r++) {
    for (let c = 1; c < MAP_W - 1; c++) {
      if (MAP[r][c] === 1) {
        // Verifica se a parede está entre dois caminhos (horizontal ou vertical)
        const pathLeft = MAP[r][c-1] === 0;
        const pathRight = MAP[r][c+1] === 0;
        const pathUp = MAP[r-1][c] === 0;
        const pathDown = MAP[r+1][c] === 0;

        // Se a parede separa dois caminhos, quebra com 75% de chance
        if ((pathLeft && pathRight) || (pathUp && pathDown)) {
          if (Math.random() < 0.75) { 
            MAP[r][c] = 0;
          }
        }
      }
    }
  }
  // ===============================================

  player.x = 1 * TILE + TILE / 2;
  player.y = 1 * TILE + TILE / 2;
  player.invulnerable = false;
  target.x = (MAP_W - 2) * TILE + TILE / 2;
  target.y = (MAP_H - 2) * TILE + TILE / 2;
  target.active = false;

  const emptyCells = [];
  for (let r = 1; r < MAP_H - 1; r++) {
    for (let c = 1; c < MAP_W - 1; c++) {
      if (MAP[r][c] === 0 && !(r === 1 && c === 1) && !(r === MAP_H - 2 && c === MAP_W - 2)) {
        emptyCells.push({ c, r });
      }
    }
  }
  emptyCells.sort(() => Math.random() - 0.5);

  items = [];
  const numItems = Math.min(3 + (currentLevel - 1), Math.floor(emptyCells.length / 2));
  for (let i = 0; i < numItems; i++) {
    items.push({ x: emptyCells[i].c * TILE + TILE / 2, y: emptyCells[i].r * TILE + TILE / 2, r: 18, collected: false });
  }
  
  enemies = [];
  const numEnemies = Math.min(1 + Math.floor(currentLevel / 2), 3);
  for (let i = 0; i < numEnemies; i++) {
    const cell = emptyCells[emptyCells.length - 1 - i];
    if (cell) {
      const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].sort(() => Math.random() - 0.5);
      enemies.push({
        x: cell.c * TILE + TILE / 2, y: cell.r * TILE + TILE / 2, r: 18,
        gridC: cell.c, gridR: cell.r, type: i % 2 === 0 ? 'zubat' : 'koffing',
        animTimer: Math.random() * 10, dirX: dirs[0].dx, dirY: dirs[0].dy,
        speed: 2.0 + (currentLevel * 0.2)
      });
    }
  }

  rockets = [];
  const numRockets = Math.min(Math.floor(currentLevel / 2), 2);
  const rocketCells = emptyCells.filter(c => c.r > 2 && c.c > 2).sort(() => Math.random() - 0.5);
  for (let i = 0; i < numRockets; i++) {
    const cell = rocketCells[i];
    if (cell) {
      const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}].sort(() => Math.random() - 0.5);
      rockets.push({
        x: cell.c * TILE + TILE / 2, y: cell.r * TILE + TILE / 2, r: 18,
        gridC: cell.c, gridR: cell.r, type: i % 2 === 0 ? 'jessie' : 'james',
        animTimer: Math.random() * 10, dirX: dirs[0].dx, dirY: dirs[0].dy,
        speed: 1.8
      });
    }
  }
  
  totalItems = numItems;
  score = 0;
  winShown = false;
  document.getElementById('score').innerText = score;
  document.getElementById('total').innerText = totalItems;
  document.getElementById('win').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
}

window.addEventListener('keydown', e => {
  const k = e.code || e.key;
  keys[k] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code || e.key] = false;
});

function collidesWithWall(cx, cy, r) {
  const minCol = Math.floor((cx - r) / TILE), maxCol = Math.floor((cx + r) / TILE);
  const minRow = Math.floor((cy - r) / TILE), maxRow = Math.floor((cy + r) / TILE);
  for (let row = minRow; row <= maxRow; row++) {
    for (let col = minCol; col <= maxCol; col++) {
      if (row < 0 || row >= MAP_H || col < 0 || col >= MAP_W) return true;
      if (MAP[row][col] === 1) {
        const nx = Math.max(col * TILE, Math.min(cx, col * TILE + TILE));
        const ny = Math.max(row * TILE, Math.min(cy, row * TILE + TILE));
        if ((cx - nx)**2 + (cy - ny)**2 < r**2) return true;
      }
    }
  }
  return false;
}

function isCellFree(c, r) { return c >= 0 && c < MAP_W && r >= 0 && r < MAP_H && MAP[r][c] === 0; }

function hasLineOfSight(c1, r1, c2, r2) {
  if (c1 !== c2 && r1 !== r2) return false;
  if (c1 === c2) {
    for (let r = Math.min(r1, r2) + 1; r < Math.max(r1, r2); r++) if (MAP[r][c1] === 1) return false;
  } else {
    for (let c = Math.min(c1, c2) + 1; c < Math.max(c1, c2); c++) if (MAP[r1][c] === 1) return false;
  }
  return true;
}

function takeDamage() {
  player.invulnerable = true;
  lives--;
  updateLivesUI();
  document.getElementById('damage-overlay').style.display = 'block';
  setTimeout(() => document.getElementById('damage-overlay').style.display = 'none', 200);
  player.x = 1 * TILE + TILE / 2;
  player.y = 1 * TILE + TILE / 2;
  if (lives <= 0) {
    winShown = true; 
    document.getElementById('gameover').style.display = 'block';
  } else {
    setTimeout(() => { player.invulnerable = false; }, 1500);
  }
}

function updateEnemyGrid(entity, speed, chasePlayer = false) {
  const centerX = entity.gridC * TILE + TILE / 2;
  const centerY = entity.gridR * TILE + TILE / 2;
  
  const dx = centerX - entity.x;
  const dy = centerY - entity.y;
  const dist = Math.hypot(dx, dy);

  if (dist > 0) {
    const moveX = (dx / dist) * Math.min(speed, dist);
    const moveY = (dy / dist) * Math.min(speed, dist);
    entity.x += moveX;
    entity.y += moveY;
  }

  if (Math.abs(entity.x - centerX) < 1 && Math.abs(entity.y - centerY) < 1) {
    entity.x = centerX;
    entity.y = centerY;

    let canContinue = isCellFree(entity.gridC + entity.dirX, entity.gridR + entity.dirY);

    if (chasePlayer) {
      const pc = Math.floor(player.x / TILE), pr = Math.floor(player.y / TILE);
      const distToPlayer = Math.abs(pc - entity.gridC) + Math.abs(pr - entity.gridR);
      
      if (distToPlayer <= 3 && hasLineOfSight(entity.gridC, entity.gridR, pc, pr)) {
        const possibleDirs = [{dx: 1, dy: 0}, {dx: -1, dy: 0}, {dx: 0, dy: 1}, {dx: 0, dy: -1}].filter(d => isCellFree(entity.gridC + d.dx, entity.gridR + d.dy));
        if (possibleDirs.length > 0) {
          let bestDir = possibleDirs[0], bestDist = Infinity;
          for (let d of possibleDirs) {
            const dist = Math.abs(pc - (entity.gridC + d.dx)) + Math.abs(pr - (entity.gridR + d.dy));
            if (dist < bestDist) { bestDist = dist; bestDir = d; }
          }
          entity.dirX = bestDir.dx; entity.dirY = bestDir.dy;
          canContinue = true;
        }
      }
    }

    if (!canContinue) {
      const possibleDirs = [{dx: 1, dy: 0}, {dx: -1, dy: 0}, {dx: 0, dy: 1}, {dx: 0, dy: -1}].filter(d => isCellFree(entity.gridC + d.dx, entity.gridR + d.dy));
      if (possibleDirs.length > 0) {
        const chosen = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
        entity.dirX = chosen.dx; entity.dirY = chosen.dy;
        canContinue = true;
      }
    }
    
    if (canContinue) {
      entity.gridC += entity.dirX;
      entity.gridR += entity.dirY;
    }
  }
}

function update() {
  if (winShown) return;

  let dx = 0, dy = 0;
  if (keys['ArrowUp'])    dy -= 1;
  if (keys['ArrowDown'])  dy += 1;
  if (keys['ArrowLeft'])  dx -= 1;
  if (keys['ArrowRight']) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx = (dx / len) * player.speed;
    dy = (dy / len) * player.speed;
    if (Math.abs(dx) > Math.abs(dy)) player.dir = dx > 0 ? 'right' : 'left';
    else player.dir = dy > 0 ? 'down' : 'up';
    if (!collidesWithWall(player.x + dx, player.y, player.r)) player.x += dx;
    if (!collidesWithWall(player.x, player.y + dy, player.r)) player.y += dy;
    player.animTimer += 0.3;
  } else {
    player.animTimer += 0.1;
  }

  enemies.forEach(enemy => {
    enemy.animTimer += 0.1;
    updateEnemyGrid(enemy, enemy.speed, false);
  });

  rockets.forEach(rocket => {
    rocket.animTimer += 0.1;
    updateEnemyGrid(rocket, rocket.speed, true);
  });

  items.forEach(item => {
    if (!item.collected && Math.hypot(player.x - item.x, player.y - item.y) < player.r + item.r) {
      item.collected = true;
      score++;
      document.getElementById('score').innerText = score;
      if (score === totalItems) target.active = true;
    }
  });

  if (!player.invulnerable) {
    let hit = false;
    enemies.concat(rockets).forEach(e => {
      if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r - 8) hit = true;
    });
    if (hit) takeDamage();
  }

  if (target.active && Math.hypot(player.x - target.x, player.y - target.y) < player.r + target.r) {
    winShown = true;
    document.getElementById('win').style.display = 'block';
  }
}

function drawMap() {
  for (let row = 0; row < MAP_H; row++) {
    for (let col = 0; col < MAP_W; col++) {
      if (MAP[row][col] === 1) {
        ctx.fillStyle = '#2d5a1e'; ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
        ctx.strokeStyle = '#1f4014'; ctx.strokeRect(col * TILE, row * TILE, TILE, TILE);
      } else {
        ctx.fillStyle = (row + col) % 2 === 0 ? '#8fd45a' : '#83c94f';
        ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
      }
    }
  }
}

function drawSprite(img, x, y, size, flip = false, fallbackType = 'pokemon', fallbackColor = '#ffcc00') {
  const isLoaded = img && img.complete && img.naturalWidth > 0;
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  
  if (isLoaded) {
    ctx.drawImage(img, -size/2, -size/2, size, size);
  } else {
    if (fallbackType === 'rocket') {
      ctx.fillStyle = '#d32f2f'; 
      ctx.fillRect(-size/2, -size/2, size, size);
      ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 3;
      ctx.strokeRect(-size/2, -size/2, size, size);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${size*0.7}px Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('R', 0, 2);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, size/2, 0, Math.PI * 2);
      ctx.fillStyle = fallbackColor; ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayer() {
  if (player.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) return;
  const fo = Math.sin(player.animTimer * 3) * 2;
  const colors = { pikachu: '#ffe033', charmander: '#ff7f27', bulbasaur: '#7ec8e3', squirtle: '#6eb8e0' };
  drawSprite(sprites[currentCharacter], player.x, player.y + fo, 46, false, 'pokemon', colors[currentCharacter]);
}

function loop() {
  update();
  drawMap();
  items.forEach(i => { if (!i.collected) drawSprite(sprites.pokeball, i.x, i.y, 36, false, 'pokemon', '#ff1c1c'); });
  
  enemies.forEach(e => {
    const fo = Math.sin(e.animTimer * 4) * 3;
    drawSprite(sprites[e.type], e.x, e.y + fo, 42, false, 'pokemon', e.type === 'zubat' ? '#8b7bb8' : '#a0522d');
  });
  
  rockets.forEach(r => {
    drawSprite(sprites[r.type], r.x, r.y, 46, r.dirX === -1, 'rocket');
  });
  
  if (target.active) {
    const sc = 1 + Math.sin(Date.now() / 200) * 0.15;
    ctx.save(); ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 15;
    drawSprite(sprites.goldball, target.x, target.y, 46 * sc, false, 'pokemon', '#ffd700');
    ctx.restore();
  }
  
  drawPlayer();
  gameLoopId = requestAnimationFrame(loop);
}
</script>
